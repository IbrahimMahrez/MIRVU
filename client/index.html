<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mirvu - AI Interview Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg: {
                primary: '#F3F7FE',
                secondary: '#FFFFFF',
                card: '#FFFFFF',
                'card-hover': '#F0F5FF',
                input: '#EFF6FF',
              },
              border: {
                primary: '#E5EAF5',
                active: '#2563EB',
              },
              accent: {
                primary: '#2563EB',
                secondary: '#1D4ED8',
              },
              text: {
                primary: '#0B1F4D',
                secondary: '#5B6B8C',
                muted: '#9CA3AF',
              },
              navy: {
                DEFAULT: '#0B2A5B',
                light: '#1a3a6e',
              },
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'Manrope', 'system-ui', 'sans-serif'],
            },
          },
        },
      }
    </script>
  </head>
  <body class="bg-[#F3F7FE] text-[#0B1F4D] min-h-screen antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
